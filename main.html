<!DOCTYPE html>
<html lang="en">

<head>
    <title>MyHike</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script type="module" src="/src/components/site-navbar.js"></script>
    <script type="module" src="/src/components/site-footer.js"></script>
</head>

<body>
    <site-navbar></site-navbar>

    <main>
        <div class="container-fluid bg-light text-dark p-5">
            <div class="container bg-light p-5">
                <h1 class="display-4">
                    Good morning <span id="name-goes-here">friend</span>
                </h1>
                <hr>
                <p>
                    Quote of the day:
                    <span id="quote-goes-here"></span>
                </p>
            </div>
        </div>

        <div class="container-fluid bg-body text-dark p-5">
            <div class="container">
                <h1>Popular Hikes</h1>
                <div id="hikes-go-here" class="row row-cols-1 row-cols-md-3 g-4">
                </div>
            </div>
        </div>
    </main>

    <template id="hikeCardTemplate">
        <div class="col">
            <div class="card h-100">
                <img class="card-img-top card-image" src="" alt="Hike image" style="height: 200px; object-fit: cover;">

                <div class="card-body">
                    <h5 class="card-title"></h5>
                    <p class="card-text"></p>
                    <p>
                        Length: <span class="card-length"></span> km
                    </p>
                    <a class="btn btn-primary read-more" href="#">
                        Read More
                    </a>
                </div>
            </div>
        </div>
    </template>

    <site-footer></site-footer>

    <script type="module" src="/src/app.js"></script>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
